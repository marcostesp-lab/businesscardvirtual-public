<style>

  * { box-sizing: border-box; margin: 0; }

  body {
    font-family: "Manrope", system-ui, -apple-system, sans-serif;

  .card {
    width: 100%;

    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 32px 24px 24px;
    box-shadow: 0 1px 2px rgba(20,48,42,.04), 0 12px 32px rgba(20,48,42,.06);
  }
  .mono {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid; place-items: center;
    font-family: "Newsreader", Georgia, serif;
    font-size: 26px;
    letter-spacing: .02em;
    margin-bottom: 20px;
  }
  h1 {

    font-weight: 500;
    font-size: 30px;
    line-height: 1.12;
    letter-spacing: -.01em;
  }
  .role { margin-top: 8px; font-size: 15px; font-weight: 600; }
  .org { margin-top: 2px; font-size: 15px; color: var(--ink-soft); }
  .loc { margin-top: 2px; font-size: 13px; color: var(--ink-soft); }

  .save {
    margin-top: 28px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-ink);
    font: 600 16px/1 "Manrope", system-ui, sans-serif;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease, opacity .12s ease;
  }
  .save:active { transform: scale(.98); opacity: .9; }
  .save svg { width: 20px; height: 20px; }

  .links { margin-top: 20px; border-top: 1px solid var(--line); }
  .links a {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 2px;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
    font-size: 15px;
    -webkit-tap-highlight-color: transparent;
  }
  .links a:last-child { border-bottom: 0; }
  .ico {
    flex: none;
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--chip);
    display: grid; place-items: center;
  }
  .ico svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .lbl { display: block; font-size: 12px; color: var(--ink-soft); }
  .val { display: block; overflow-wrap: anywhere; }
